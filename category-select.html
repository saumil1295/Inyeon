  <div class="category-header">

    <h1>What kind of moment are you looking for today?</h1>

      Choose the kind of story you have space to hold right now.

  <div class="category-columns two-choice">

    <!-- Heavier -->

    <button class="emotion-card moment-card heavy" data-category="difficult">

      <div class="moment-icon">🌊</div>

      <div class="moment-content">
        <h3>Heavier moments</h3>
        <p>When you're carrying something that feels hard to hold.</p>
      </div>

      <span class="moment-arrow">›</span>

    </button>

    <!-- Lighter -->

    <button class="emotion-card moment-card light" data-category="lighter">

      <div class="moment-icon">🍃</div>

      <div class="moment-content">
        <h3>Lighter moments</h3>
        <p>When you're noticing hope, gratitude, relief, or small wins.</p>
      </div>

      <span class="moment-arrow">›</span>

    </button>

  </div>

</main>

<!-- ==========================
     Full-screen Category Transition
========================== -->

<div id="categoryTransition" class="category-transition">

  <div class="transition-center">

    <div id="transitionIcon" class="transition-icon">🌊</div>

    <h2 id="transitionText">
      Stepping into someone's difficult day.
    </h2>

  </div>

</div>

<script>

const overlay = document.getElementById("categoryTransition");
const transitionText = document.getElementById("transitionText");
const transitionIcon = document.getElementById("transitionIcon");

document.querySelectorAll(".emotion-card").forEach(card => {

  card.addEventListener("click", () => {

    const category = card.dataset.category;

    if (category === "difficult") {

      overlay.classList.add("heavy-mode");
      overlay.classList.remove("light-mode");

      transitionIcon.textContent = "🌊";
      transitionText.textContent = "Stepping into someone's difficult day.";

    } else {

      overlay.classList.add("light-mode");
      overlay.classList.remove("heavy-mode");

      transitionIcon.textContent = "🍃";
      transitionText.textContent = "Something gentle is waiting.";

    }

    overlay.classList.add("show");

    setTimeout(() => {

      window.location.href =
        `respond.html?category=${encodeURIComponent(category)}`;

    }, 350);

  });

});

</script>

<script>
window.addEventListener("pageshow", (event) => {
  if (event.persisted) {
    // Reset any transition overlays when returning via Back
    const overlay = document.getElementById("categoryTransition");
    overlay?.classList.remove("show", "heavy-mode", "light-mode");
  }
});
</script>

</body>

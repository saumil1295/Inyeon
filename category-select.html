<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Choose a Category • Inyeon</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="decor-circle decor-circle-tl"></div>

<a href="index.html" class="home-link">Inyeon</a>

<main>

  <div class="category-header">
    <h1>What feels easiest to hold today?</h1>

    <p class="subtext">
      You don't have to carry every story.
      Start with one you're ready to listen to.
    </p>
  </div>

  <div class="category-columns">

    <div class="category-group">

      <h3>Difficult feelings</h3>

      <button class="emotion-card" data-category="Overwhelmed">
        🌊 <span>Overwhelmed</span>
      </button>

      <button class="emotion-card" data-category="Anxious">
        🌙 <span>Anxious</span>
      </button>

      <button class="emotion-card" data-category="Lonely">
        ☁️ <span>Lonely</span>
      </button>

      <button class="emotion-card" data-category="Hurt">
        💔 <span>Hurt</span>
      </button>

      <button class="emotion-card" data-category="Frustrated">
        😤 <span>Frustrated</span>
      </button>

    </div>

    <div class="category-group">

      <h3>Lighter feelings</h3>

      <button class="emotion-card" data-category="Calm">
        🍃 <span>Calm</span>
      </button>

      <button class="emotion-card" data-category="Settled">
        🌿 <span>Settled</span>
      </button>

      <button class="emotion-card" data-category="Optimistic">
        ✨ <span>Optimistic</span>
      </button>

      <button class="emotion-card" data-category="Uplifted">
        ☀️ <span>Uplifted</span>
      </button>

      <button class="emotion-card" data-category="Grateful">
        💛 <span>Grateful</span>
      </button>

    </div>

  </div>

</main>

<nav class="bottom-nav">
  <a href="index.html" class="bottom-nav-item active">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
      <polyline points="9 22 9 12 15 12 15 22"/>
    </svg>
    <span>Home</span>
  </a>

  <a href="my-responses.html" class="bottom-nav-item">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
    </svg>
    <span>My Responses</span>
  </a>

  <a href="given-responses.html" class="bottom-nav-item">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
    </svg>
    <span>My Support</span>
  </a>
</nav>

<script>
document.querySelectorAll(".emotion-card").forEach(card => {
  card.addEventListener("click", () => {

    document.querySelectorAll(".emotion-card")
      .forEach(c => c.classList.remove("selected"));

    card.classList.add("selected");

    const category = card.dataset.category;

    setTimeout(() => {
      window.location.href =
        `respond.html?category=${encodeURIComponent(category)}`;
    }, 180);

  });
});
</script>

</body>
</html>

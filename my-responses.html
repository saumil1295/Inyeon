<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inyeon — My Responses</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="decor-circle decor-circle-tl"></div>

  <a href="index.html" class="home-link">Inyeon</a>

  <button id="menuBtn" class="menu-btn">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none"
      stroke="currentColor" stroke-width="2" stroke-linecap="round"
      stroke-linejoin="round">
      <line x1="3" y1="6" x2="21" y2="6"/>
      <line x1="3" y1="12" x2="21" y2="12"/>
      <line x1="3" y1="18" x2="21" y2="18"/>
    </svg>
  </button>

  <div id="menuDropdown" class="menu-dropdown hidden">
    <a href="profile.html" class="menu-item">Profile</a>
    <a href="#" id="menuSignOut" class="menu-item">Sign out</a>
  </div>

  <main>

    <h1>What you've shared</h1>

    <div id="postsList"></div>

    <p id="emptyState" class="hidden">
      You haven't posted anything yet.
    </p>

  </main>

  <nav id="bottomNav" class="bottom-nav">

  <a href="index.html#compose" class="bottom-nav-item">
    <!-- Pen icon -->
    <svg width="22" height="22" viewBox="0 0 24 24"
         fill="none" stroke="currentColor" stroke-width="2">
      <path d="M12 20h9"/>
      <path d="M16.5 3.5a2.1 2.1 0 1 1 3 3L7 19l-4 1 1-4Z"/>
    </svg>
    <span>Post</span>
  </a>

  <a href="category-select.html" class="bottom-nav-item">
    <!-- Heart handshake -->
    <svg width="22" height="22" viewBox="0 0 24 24"
         fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M11 13l2 2 7-7"/>
      <path d="M5 12l2 2 3-3"/>
      <path d="M3 8a2 2 0 0 1 2-2h3l2 3h4l2-3h3a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-3l-2-3h-4l-2 3H5a2 2 0 0 1-2-2V8z"/>
    </svg>
    <span>Listen</span>
  </a>

  <a href="my-responses.html" class="bottom-nav-item active">
    <!-- Message -->
    <svg width="22" height="22" viewBox="0 0 24 24"
         fill="none" stroke="currentColor" stroke-width="2">
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
    </svg>
    <span>Responses</span>
  </a>

  <a href="given-responses.html" class="bottom-nav-item">
    <!-- Heart -->
    <svg width="22" height="22" viewBox="0 0 24 24"
         fill="none" stroke="currentColor" stroke-width="2">
      <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78L12 21.23l7.78-7.78a5.5 5.5 0 0 0 0-7.78Z"/>
    </svg>
    <span>Support</span>
  </a>

</nav>

  <!-- Delete Bottom Sheet -->

  <div id="deleteSheet" class="sheet hidden">
    <div class="sheet-content">
      <h3>Delete this post?</h3>
      <p>This removes your post and closes the conversation.</p>

      <button id="confirmDeleteBtn" class="sheet-delete-btn">
        Delete post
      </button>

      <button id="cancelDeleteBtn" class="sheet-cancel-btn">
        Cancel
      </button>
    </div>
  </div>

  <!-- Edit Modal -->

  <div id="editModal" class="edit-overlay hidden">
    <div class="edit-modal">

      <button id="closeEditModal" class="edit-close">×</button>

      <h2>Edit your post</h2>

      <p id="editTimer" class="edit-timer"></p>

      <textarea id="editTextarea" maxlength="500"></textarea>

      <button id="saveEditBtn" class="edit-save-btn">
        Save changes
      </button>

    </div>
  </div>

  <!-- Report Bottom Sheet -->

  <div id="reportSheet" class="sheet hidden">
  <div class="sheet-content report-sheet-content">

    <h3>Help us keep this space safe</h3>

    <p class="sheet-subtext">
      Choose the option that best describes this response.
    </p>

    <button class="report-option" data-reason="Hurtful or unkind">
      <span class="report-icon">💬</span>
      <span class="report-copy">
        <strong>Hurtful or unkind</strong>
        <small>Feels attacking, mocking, or dismissive.</small>
      </span>
    </button>

    <button class="report-option" data-reason="Unsafe advice">
      <span class="report-icon">⚠️</span>
      <span class="report-copy">
        <strong>Unsafe advice</strong>
        <small>Encourages harm or dangerous actions.</small>
      </span>
    </button>

    <button class="report-option" data-reason="Spam or irrelevant">
      <span class="report-icon">📢</span>
      <span class="report-copy">
        <strong>Spam or irrelevant</strong>
        <small>Advertising or unrelated content.</small>
      </span>
    </button>

    <button class="report-option" data-reason="Doesn't feel genuine">
      <span class="report-icon">🌫️</span>
      <span class="report-copy">
        <strong>Doesn't feel genuine</strong>
        <small>Looks like trolling or isn't trying to help.</small>
      </span>
    </button>

    <button class="report-option report-other" type="button">
      <span class="report-icon">•••</span>
      <span class="report-copy">
        <strong>Something else</strong>
        <small>Tell us what happened.</small>
      </span>
    </button>

    <div id="reportOtherBox" class="report-other-box hidden">
      <textarea
        id="reportOtherText"
        maxlength="300"
        placeholder="Tell us what happened..."
      ></textarea>

      <div class="report-other-footer">
        <span id="reportOtherCount">0/300</span>

        <button
          id="submitOtherReport"
          class="report-submit-btn"
          disabled
          type="button"
        >
          Submit report
        </button>
      </div>
    </div>

    <button id="closeReportSheet" class="sheet-cancel-btn" type="button">
      Cancel
    </button>

  </div>
</div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="my-responses.js"></script>

</body>
</html>

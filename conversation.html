<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inyeon — Conversation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="decor-circle decor-circle-tl"></div>
  <a href="index.html" class="home-link">Inyeon</a>

  <main>
    <div id="introOverlay" class="hidden">
      <div class="post-block">
        <p class="post-text">A limited exchange</p>
        <p class="no-responses" style="font-style: normal; text-align: center; margin-top: 10px;">
          This is a bounded conversation — up to 3 messages total, then the thread closes. Take your time; there's no rush.
        </p>
        <button id="introOkBtn" class="auth-submit-btn">Got it</button>
      </div>
    </div>

    <div id="conversationView" class="hidden">
      <p class="no-responses" id="originalPostContext" style="text-align: center; margin-bottom: 20px;"></p>

      <div id="messageThread"></div>

      <p id="messageCounter" class="char-count" style="text-align: center; margin-top: 16px;"></p>

      <div id="messageInputArea">
        <textarea id="messageInput" placeholder="Write your message..." maxlength="500"></textarea>
        <button id="sendMessageBtn" class="auth-submit-btn">Send</button>
      </div>

      <p id="closingNote" class="no-responses hidden" style="text-align: center; margin-top: 20px;">
        This exchange has reached its limit. We hope it helped.
      </p>
    </div>

    <p id="loadingState" class="no-responses">Loading...</p>
  </main>

  <nav id="bottomNav" class="bottom-nav">

  <a href="index.html#compose" class="bottom-nav-item pressable">
    <!-- Pen icon -->
    <svg width="22" height="22" viewBox="0 0 24 24"
         fill="none" stroke="currentColor" stroke-width="2">
      <path d="M12 20h9"/>
      <path d="M16.5 3.5a2.1 2.1 0 1 1 3 3L7 19l-4 1 1-4Z"/>
    </svg>
    <span>Post</span>
  </a>

  <a href="category-select.html" class="bottom-nav-item pressable">
    <!-- Heart handshake -->
    <svg width="22" height="22" viewBox="0 0 24 24"
         fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M11 13l2 2 7-7"/>
      <path d="M5 12l2 2 3-3"/>
      <path d="M3 8a2 2 0 0 1 2-2h3l2 3h4l2-3h3a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-3l-2-3h-4l-2 3H5a2 2 0 0 1-2-2V8z"/>
    </svg>
    <span>Listen</span>
  </a>

  <a href="my-responses.html" class="bottom-nav-item active pressable">
    <!-- Message -->
    <svg width="22" height="22" viewBox="0 0 24 24"
         fill="none" stroke="currentColor" stroke-width="2">
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
    </svg>
    <span>Responses</span>
  </a>

  <a href="given-responses.html" class="bottom-nav-item pressable">
    <!-- Heart -->
    <svg width="22" height="22" viewBox="0 0 24 24"
         fill="none" stroke="currentColor" stroke-width="2">
      <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78L12 21.23l7.78-7.78a5.5 5.5 0 0 0 0-7.78Z"/>
    </svg>
    <span>Support</span>
  </a>

</nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="conversation.js"></script>
</body>
</html>
